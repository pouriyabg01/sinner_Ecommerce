    <rect x="286" y="120" width="90" height="306" rx="20" fill="#131a2c" stroke="#5b6cff" stroke-width="2" opacity=".85"/>
    <rect x="170" y="130" width="80" height="4" rx="2" fill="#5b6cff" opacity=".7"/>
    <circle cx="210" cy="380" r="16" fill="#5b6cff" opacity=".25"/>
