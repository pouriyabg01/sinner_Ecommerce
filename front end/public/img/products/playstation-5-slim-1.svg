      <stop offset="0" stop-color="#1a2340"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff" stop-opacity=".38"/>
