# کل سایت در پنج کانتینر:
#   nginx    → تنها در ورودی؛ درخواست را بین لاراول و Next پخش می‌کند
#   frontend → موتور صفحه‌های Next (خروجی standalone)
#   backend  → لاراول روی PHP-FPM
#   postgres → پایگاه داده
#   redis    → کش و نشست
#
# اجرا:  docker compose up -d --build
# توقف:  docker compose down
name: sinner

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: sinner-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./docker/nginx/maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      # با NGINX_CONF=https.conf به نسخه‌ی گواهی‌دار سوئیچ می‌شود
      - ./docker/nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
      - storage:/srv/storage:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      # روی نسخه‌ی گواهی‌دار، درگاه ۸۰ فقط ریدایرکت می‌دهد؛ ۳۰۱ هم یعنی سالم است
      test: ['CMD-SHELL', 'wget -qS --spider http://127.0.0.1/up 2>&1 | grep -qE "200|301"']
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./front end
      dockerfile: ../docker/frontend/Dockerfile
      # تصویر پایه اگر روی همین ماشین باشد، از اینترنت گرفته نمی‌شود.
      # دسترسی سرور ایرانی به مخزن تصویرها ناپایدار است و ساخت را می‌انداخت.
      pull: false
      args:
        # آدرسی که مرورگرِ بازدیدکننده صدا می‌زند؛ هنگام ساخت جاسازی می‌شود.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}/api/v1
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
        NEXT_PUBLIC_API_MOCKING: disabled
    container_name: sinner-frontend
    restart: unless-stopped
    environment:
      # رندر سمت سرور داخل شبکه‌ی داکر انجام می‌شود و به آدرس عمومی دسترسی
      # ندارد؛ برای همین از نام سرویس استفاده می‌کند.
      INTERNAL_API_URL: http://nginx/api/v1
    depends_on:
      - backend
    expose:
      - '3000'

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      pull: false
    container_name: sinner-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-SInner}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY لازم است}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      APP_LOCALE: fa
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: ${DB_DATABASE:-sinner}
      DB_USERNAME: ${DB_USERNAME:-sinner}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD لازم است}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: local
      # فقط برای بار اول و روی پایگاه داده‌ی خالی
      DB_SEED: ${DB_SEED:-false}
    volumes:
      - storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '9000'

  postgres:
    image: postgres:18-alpine
    container_name: sinner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sinner}
      POSTGRES_USER: ${DB_USERNAME:-sinner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD لازم است}
    volumes:
      # پستگرس ۱۸ کل /var/lib/postgresql را می‌خواهد، نه زیرشاخه‌ی data
      - pgdata:/var/lib/postgresql
    # فقط از روی خود سرور در دسترس باشد، نه از اینترنت
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sinner} -d ${DB_DATABASE:-sinner}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: sinner-cache
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6382}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  storage:
