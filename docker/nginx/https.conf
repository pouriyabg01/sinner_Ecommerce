# نسخه‌ی گواهی‌دار. وقتی گواهی از میزبان گرفتی، در فایل .env بنویس
#   NGINX_CONF=https.conf
# و دو فایل گواهی را در پوشه‌ی مشخص‌شده با TLS_CERT_DIR بگذار:
#   fullchain.pem  (گواهی + زنجیره)
#   privkey.pem    (کلید خصوصی)
# بعضی میزبان‌ها نام دیگری می‌دهند (مثلاً example.crt و example.key)؛ فقط
# اسمشان را به همین دو تا عوض کن.

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

# هر چه با درگاه ۸۰ بیاید — جز دو استثنای زیر — به نسخه‌ی امن فرستاده می‌شود.
#
# هدایت عمداً داخل `location /` است و نه در خودِ server: دستور return در سطح
# server پیش از هر مسیری اجرا می‌شود و استثناها را بی‌اثر می‌کرد.
server {
    listen 80;
    server_name _;

    # آزمونِ صدور و تمدید گواهی؛ صادرکننده باید خودِ فایل را ببیند نه ریدایرکت را.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    # فایل‌های آپلودشده روی درگاه ۸۰ هم مستقیم داده می‌شوند و هدایت نمی‌شوند.
    # دلیلش بیرون نیست، داخل است: بهینه‌ساز تصویرِ نکست این فایل‌ها را از داخل
    # شبکه‌ی داکر و با http://nginx/... می‌گیرد. با هدایت، به https://nginx/...
    # می‌رسید که گواهی‌اش برای دامنه است نه برای نام سرویس، و همه‌ی تصویرهای
    # کالاها می‌شکست. خودِ فایل‌ها عمومی‌اند، پس دادنشان روی درگاه ۸۰ چیزی را
    # لو نمی‌دهد.
    location /storage/ {
        alias /srv/storage/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # مرورگر یک سال یادش می‌ماند که این سایت فقط امن است.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /storage/ {
        alias /srv/storage/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/(api|up)(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $https_flag if_not_empty;
        fastcgi_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
