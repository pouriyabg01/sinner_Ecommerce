# نگاشت‌هایی که باید بیرون از بلاک server تعریف شوند.

# برای وب‌سوکت توسعه و هر اتصال ارتقایافته‌ای که Next باز می‌کند.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# لاراول از روی این می‌فهمد پشت پروکسی، درخواست امن بوده یا نه.
map $scheme $https_flag {
    default '';
    https   on;
}
