# تنها دری که به بیرون باز است. هر درخواست اول اینجا می‌آید و از اینجا
# یا به لاراول (PHP-FPM) می‌رود یا به موتور صفحه‌ها (Next).

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # تصویرهای آپلودشده؛ ولوم مشترک با کانتینر لاراول.
    location /storage/ {
        alias /srv/storage/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # لاراول: هم مسیر API، هم مسیر سلامت /up.
    location ~ ^/(api|up)(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $https_flag if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # فایل‌های ساکن Next؛ نامشان هش دارد پس می‌شود طولانی کش کرد.
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # بقیه‌ی سایت.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
